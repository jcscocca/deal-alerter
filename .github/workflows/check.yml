name: Check deals

# Scheduled alert runs, nothing else. The test suite gates code in tests.yml
# instead: run before every check, one broken test silenced every alert until
# somebody noticed, and a date-pinned test in ai-deal-alerter once went red on
# its own with nobody touching the code.
on:
  schedule:
    # Steam, daily at 18:22 UTC: Steam flips sale pricing around 10:00 PT, so
    # this lands shortly after new discounts go live.
    - cron: '22 18 * * *'
    # Hardware digest, daily. Email only; lateness costs nothing here.
    # Both dailies sit off the 15-minute ticks: the queue below keeps one
    # pending run, and a fast run arriving behind a pending daily cancels it.
    - cron: '52 2 * * *'
    # Hardware fast loop, push only, every 15 minutes around the clock. The
    # repository went public on 2026-09-25, so Actions minutes cost nothing.
    # eBay's Browse API allows 5,000 calls a day and a run makes one per search
    # query (24), so 96 runs come to ~2,300. Reddit's anonymous RSS throttling
    # was ~80% of a run, so this loop leaves it out and it gets its own below.
    # GitHub drops many scheduled runs; see the README before trusting the 15.
    - cron: '*/15 * * * *'
    # Reddit, hourly, push only.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      domain:
        type: choice
        options: [steam, hardware]
        default: steam
      mode:
        type: choice
        options: [digest, fast]
        default: digest
      dry_run:
        type: boolean
        default: true
      # Comma-separated source names (reddit, slickdeals, apple-refurb, ebay);
      # empty runs them all.
      sources:
        type: string
        default: ''

permissions:
  contents: write

# Both domains write to one branch. Separate concurrency groups would still
# race at git push, even though their state files have different names.
concurrency:
  group: deal-alerter-state-writer
  cancel-in-progress: false

jobs:
  check:
    # One switch per schedule, so each can go live as soon as its own secrets
    # exist. ENABLE_HARDWARE is the daily digest and needs only SMTP;
    # ENABLE_HARDWARE_FAST needs NTFY_TOPIC or DISCORD_WEBHOOK, and without one
    # every fast run would fail on configuration.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '22 18 * * *' && vars.ENABLE_STEAM == 'true') ||
      (github.event.schedule == '52 2 * * *' && vars.ENABLE_HARDWARE == 'true') ||
      ((github.event.schedule == '*/15 * * * *' || github.event.schedule == '7 * * * *') &&
        vars.ENABLE_HARDWARE_FAST == 'true')
    runs-on: ubuntu-latest
    env:
      STEAM_ID: ${{ secrets.STEAM_ID }}
      ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DESKTOP_NOTIFY: '0'
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt -r alerters/hardware/native/requirements.txt
      - name: Check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DOMAIN: ${{ inputs.domain }}
          MODE: ${{ inputs.mode }}
          DRY: ${{ inputs.dry_run }}
          HARDWARE_SOURCES: ${{ inputs.sources }}
        run: |
          if [ "$EVENT" != workflow_dispatch ]; then
            case "$SCHEDULE" in
              '22 18 * * *') DOMAIN=steam; MODE=digest ;;
              '52 2 * * *') DOMAIN=hardware; MODE=digest ;;
              '*/15 * * * *') DOMAIN=hardware; MODE=fast; HARDWARE_SOURCES=ebay,slickdeals,apple-refurb ;;
              '7 * * * *') DOMAIN=hardware; MODE=fast; HARDWARE_SOURCES=reddit ;;
              *) echo "Unrecognised schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          export HARDWARE_SOURCES
          flags=("--$MODE" --quiet-when-empty)
          if [ "$DRY" = true ]; then flags+=(--dry-run); fi
          python -m alerters "$DOMAIN" "${flags[@]}"
      # A dry run sends nothing, so the preview is the only way to see what it
      # would have sent.
      - name: Keep the dry-run preview
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ inputs.domain }}-${{ inputs.mode }}
          path: report-*.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve observations and successful delivery receipts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never stage secrets, previews or the disposable SQLite cache.
          find state -type f \( -name '*.json' -o -name '*.jsonl' \) -print0 |
            xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            git commit -m 'Update deal evidence and delivery receipts'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
