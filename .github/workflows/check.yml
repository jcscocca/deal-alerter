name: Check deals

# Scheduled alert runs, nothing else. The test suite gates code in tests.yml
# instead: run before every check, one broken test silenced every alert until
# somebody noticed, and a date-pinned test in ai-deal-alerter once went red on
# its own with nobody touching the code.
on:
  schedule:
    # Steam, daily at 18:22 UTC: Steam flips sale pricing around 10:00 PT, so
    # this lands shortly after new discounts go live.
    - cron: '22 18 * * *'
    # Hardware digest, daily. Email only; lateness costs nothing here.
    # Both dailies sit off the 15-minute ticks: the queue below keeps one
    # pending run, and a fast run arriving behind a pending daily cancels it.
    - cron: '52 2 * * *'
    # Hardware fast loop, push only, every 15 minutes around the clock. The
    # repository went public on 2026-09-25, so Actions minutes cost nothing.
    # eBay's Browse API allows 5,000 calls a day and a run makes one per search
    # query (at most 24), so 96 runs come to ~2,300. Reddit's anonymous RSS
    # throttling was ~80% of a run, so only r/buildapcsales rides this loop:
    # its retail deals sell out within the hour, and one feed is one request.
    # Observed 2026-09-22: "[gpu] rtx 5090 for $4299 at Walmart" was up for a
    # single run. GitHub drops many scheduled runs; see the README.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      domain:
        type: choice
        options: [steam, hardware]
        default: steam
      mode:
        type: choice
        options: [digest, fast]
        default: digest
      dry_run:
        type: boolean
        default: true
      # Comma-separated source names (reddit, slickdeals, apple-refurb, ebay);
      # empty runs them all.
      sources:
        type: string
        default: ''

permissions:
  contents: write

# Both domains write to one branch. Separate concurrency groups would still
# race at git push, even though their state files have different names.
concurrency:
  group: deal-alerter-state-writer
  cancel-in-progress: false

jobs:
  check:
    # One switch per schedule, so each can go live as soon as its own secrets
    # exist. ENABLE_HARDWARE is the daily digest and needs only SMTP;
    # ENABLE_HARDWARE_FAST needs NTFY_TOPIC or DISCORD_WEBHOOK, and without one
    # every fast run would fail on configuration.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '22 18 * * *' && vars.ENABLE_STEAM == 'true') ||
      (github.event.schedule == '52 2 * * *' && vars.ENABLE_HARDWARE == 'true') ||
      (github.event.schedule == '*/15 * * * *' && vars.ENABLE_HARDWARE_FAST == 'true')
    runs-on: [self-hosted, Linux, thinkpad]
    env:
      STEAM_ID: ${{ secrets.STEAM_ID }}
      ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DESKTOP_NOTIFY: '0'
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Retain isolated checkouts for fourteen days
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = fs.realpathSync(path.join(process.env.GITHUB_WORKSPACE, 'work'));
          const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
          for (const name of fs.readdirSync(root)) {
            if (!/^[0-9]+-[0-9]+-[A-Za-z0-9_-]+-[0-9]+$/.test(name)) continue;
            const target = path.join(root, name);
            const stat = fs.lstatSync(target);
            if (!stat.isDirectory() || stat.isSymbolicLink() || stat.mtimeMs >= cutoff) continue;
            if (!fs.realpathSync(target).startsWith(root + path.sep)) throw new Error('Unsafe cleanup path');
            fs.rmSync(target, {recursive: true, force: true});
          }
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Isolate Python dependencies and temporary files
        shell: python {0}
        run: |
          import os, pathlib, tempfile, venv
          root = pathlib.Path(tempfile.mkdtemp(prefix="ci-python-", dir=os.environ["RUNNER_TEMP"]))
          venv.create(root / "venv", with_pip=True)
          (root / "tmp").mkdir()
          with open(os.environ["GITHUB_PATH"], "a") as output:
              print(root / "venv" / ("Scripts" if os.name == "nt" else "bin"), file=output)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("VIRTUAL_ENV=" + str(root / "venv"), file=output)
              print("PYTHONNOUSERSITE=1", file=output)
              for key in ("TMPDIR", "TMP", "TEMP"):
                  print(key + "=" + os.environ.get("CI_JOB_TEMP", str(root / "tmp")), file=output)
      - name: Install
        run: python -m pip install -r requirements.txt -r alerters/hardware/native/requirements.txt
      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DOMAIN: ${{ inputs.domain }}
          MODE: ${{ inputs.mode }}
          DRY: ${{ inputs.dry_run }}
          HARDWARE_SOURCES: ${{ inputs.sources }}
          HARDWARE_WRITER: ${{ vars.HARDWARE_WRITER }}
        run: |
          if [ "$EVENT" != workflow_dispatch ]; then
            case "$SCHEDULE" in
              '22 18 * * *') DOMAIN=steam; MODE=digest ;;
              '52 2 * * *') DOMAIN=hardware; MODE=digest ;;
              '*/15 * * * *') DOMAIN=hardware; MODE=fast; HARDWARE_SOURCES=ebay,slickdeals,reddit ;;
              *) echo "Unrecognised schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          if [ "$DOMAIN" = hardware ] && [ "$DRY" != true ] && [ "$HARDWARE_WRITER" = thinkpad ]; then
            echo "Hardware state belongs to the ThinkPad monitor; use a dry run."
            exit 0
          fi
          export HARDWARE_SOURCES
          flags=("--$MODE" --quiet-when-empty)
          if [ "$DRY" = true ]; then flags+=(--dry-run); fi
          python -m alerters "$DOMAIN" "${flags[@]}"
      # A dry run sends nothing, so the preview is the only way to see what it
      # would have sent.
      - name: Keep the dry-run preview
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ inputs.domain }}-${{ inputs.mode }}
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/report-*.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve observations and successful delivery receipts
        if: always()
        env:
          DOMAIN: ${{ steps.check.outputs.domain }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never stage secrets, previews or the disposable SQLite cache.
          case "$DOMAIN" in steam|hardware) ;; *) exit 0 ;; esac
          find "state/$DOMAIN" -type f \( -name '*.json' -o -name '*.jsonl' \) -print0 |
            xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            git commit -m 'Update deal evidence and delivery receipts'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac
