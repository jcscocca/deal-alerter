[pytest]
testpaths = tests
# Keep pytest's scratch directory inside the repo. The system temp root is not
# always writable (locked-down Windows profiles, CI sandboxes), and a failure
# there shows up as a confusing PermissionError from deep inside pytest rather
# than anything to do with the tests. Carried over from ai-deal-alerter, where
# this was learned the hard way; dropping it cost 21 spurious errors here.
addopts = --basetemp=.pytest_tmp
