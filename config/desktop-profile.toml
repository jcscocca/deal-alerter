# Watch factory 32GB and 64GB PCs to combine with the owned 2x32GB kit.
# Prices are PC totals before tax. Mixing compatibility remains unverified.
[memory]
owned_kit = "Corsair Vengeance RGB CMH64GX5M2B6000C40W"
owned_gb = 64
owned_modules = 2
owned_rated_mt_s = 6000
minimum_gb = 96
preferred_gb = 128
required_slots = 4
# User preference: surface promising deals while clearly flagging unknowns.
allow_unverified = true

# Provisional notification settings, not user-approved spending limits or
# predicted sale prices. Each prebuilt band prices a reference build (factory
# 32GB, 1TB SSD, 9800X3D-class CPU); [components] shifts all three thresholds
# by the value of the parts that differ. Missing storage or CPU earns no credit.
# Unknown RAM is valued as 64GB at normal priority, clearly flagged.
# Calibrated to manually checked listings on 2026-10-06: HP 32GB $2799.99.
[price.rtx_5080]
ceiling = 3000.0
target = 2800.0
urgent = 2500.0
# The existing RTX 5090 ceiling continues to come from watchlist.toml.

# Added 2026-10-10. Notification settings, not a forecast or purchase budget.
# New cards only. $900 is a standout stretch deal; current asks are ~$1,170.
[price.rtx_5070_ti_card]
ceiling = 1000.0
target = 950.0
urgent = 900.0

# Complete PC totals including known shipping, before tax. Recent 32GB sales
# at $1,899/$1,999 are expired; allow useful reductions above those sale lows.
[price.rtx_5070_ti]
ceiling = 2200.0
target = 2100.0
urgent = 2000.0

# Checked 2026-10-13, US new before tax. RAM and SSD are valued at retail
# because you keep them; the CPU at used resale because you would sell it.
[components]
checked_on = "2026-10-13"
# Cheapest-tier 64GB DDR5-6000 kits $930-1,000.
reference_ram_gb = 32
ram_per_gb = 15.0
# PCIe 4.0 NVMe medians: 1TB $196, 2TB $365, 4TB $600.
reference_ssd_tb = 1
ssd_per_tb = 135.0
reference_cpu = "9800X3D"

