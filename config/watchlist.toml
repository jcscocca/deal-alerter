# What to hunt for.
#
# Steam watches a fixed list of appids. Hardware doesn't work that way: you
# don't want "this exact SKU", you want "any 24GB Ampere card under $700,
# whoever is selling it". So a hunt is a *rule*.
#
# Every hunt needs either `parts` (catalog keys, see
# alerters/hardware/native/catalog.py) or a `class` filter. `target` is the price
# at or below which you always get pushed regardless of what the history says
# -- the equivalent of config/steam-targets.json. `queries` adds searches beyond
# the parts' own names. Complete-machine queries are retired.
#
# Watches are for standalone parts and displays. Current inventory is context,
# never an alert veto. Complete PCs and laptop purchase plans are retired.
# Targets remain the existing explicit price notices; history/trust checks apply.
# Unified-memory machines are not hunted.
#
# ---------------------------------------------------------------------- tier 1
# Standalone GPU price and capacity opportunities.
[[hunt]]
name = "RTX PRO 6000 Blackwell"
parts = ["rtx_pro_6000_blackwell_maxq", "rtx_pro_6000_blackwell"]
target = 13000.0
note = "96GB single-device capacity; verify exact card fit in the completed MSI build."

[[hunt]]
name = "RTX 3090 cards"
parts = ["rtx_3090", "rtx_3090_ti"]
target = 1250.0

[[hunt]]
name = "RTX 5090"
parts = ["rtx_5090"]
target = 5000.0

[[hunt]]
name = "RTX 5080 cards"
parts = ["rtx_5080"]
target = 1500.0
# Standalone new-card thresholds are in parts-watch.toml.

[[hunt]]
name = "RTX 4090"
parts = ["rtx_4090"]
target = 2600.0

# Added 2026-10-10 for gaming/compute price alerts, independent of the native
# VRAM-pool score. parts-watch.toml owns standalone new-card price bands.
[[hunt]]
name = "RTX 5070 Ti cards"
parts = ["rtx_5070_ti"]
target = 1000.0
note = "$900 is an urgent price threshold, not an estimate of market value."

# ---------------------------------------------------------------------- tier 2
# 48GB single-slot-ish pro cards. Blower coolers, no transient power spikes.
# Split in two because one target cannot serve a $4,000 A6000 and a $7,000 Ada.
[[hunt]]
name = "RTX A6000"
parts = ["rtx_a6000"]
target = 3600.0

[[hunt]]
name = "48GB Ada and Blackwell pro cards"
parts = ["rtx_6000_ada", "l40s", "rtx_pro_5000_blackwell"]
target = 6500.0

# ------------------------------------------------------------- AMD and Intel
# Cheaper capacity at real bandwidth, and a software stack that is the entire
# reason it is cheaper: llama.cpp runs on all of these, vLLM and most
# quantisation tooling do not. Worth watching, worth reading the note before
# buying. Every reference price here is an estimate, so these stay
# WATCH / UNVERIFIED until somebody checks one against sold data.
[[hunt]]
name = "AMD pro cards (32-48GB)"
parts = ["radeon_pro_w7900", "radeon_pro_w7800", "radeon_ai_pro_r9700"]
target = 1400.0
note = "W7900 is 48GB at A6000 bandwidth. Three slots and ROCm-only."

[[hunt]]
name = "24GB non-NVIDIA"
parts = ["rx_7900_xtx", "arc_pro_b60"]
target = 450.0
note = "Below the catch-all's 32GB floor, so it needs naming to be seen at all."

# ---------------------------------------------------------------------- tier 4
# Datacenter. Mostly gray-market; verify the seller hard before buying.
[[hunt]]
name = "Datacenter accelerators"
class = "datacenter"
min_vram_gb = 40
target = 3200.0
note = "A100 40GB PCIe under $4k is the interesting one. Needs blower airflow."

# ------------------------------------------------------------------ open-ended
# A catch-all so a card the catalog doesn't know about still gets seen. Judged
# on $/GB-VRAM alone since there's no reference price to compare against.
# Every class but unified: "any" would bring the Macs straight back.
[[hunt]]
name = "Anything with lots of VRAM, cheap"
class = ["consumer", "pro", "datacenter"]
min_vram_gb = 32
max_dollars_per_gb = 25.0

# -------------------------------------------------------------------- products
# Things bought for themselves rather than for the memory they add. A product
# part (kind PRODUCT in catalog.py) is judged on price alone: its own log, and
# a retail list price until the log can rank. No $/GB, no model ladder, no
# upgrade cap. Only a new or open-box unit can alert against a list price; used
# and refurbished ones are shown as WATCH until their own history builds up.
#
# Coverage is whatever the monitor already reads: eBay (the part's name is its
# search), the Slickdeals Computers page and r/buildapcsales. Amazon and Best
# Buy prices reach it only when someone posts them there.
# ThinkPad P16 Gen 2: user requested both spare 32GB and upgrade 48GB modules.
# Kit limits are for the complete purchase, not per module. 2026-10-10.
[[hunt]]
name = "ThinkPad DDR5 SO-DIMM 32GB sticks"
parts = ["ddr5_sodimm_32"]
target = 200.0

[[hunt]]
name = "ThinkPad DDR5 SO-DIMM 48GB sticks"
parts = ["ddr5_sodimm_48"]
target = 300.0

[[hunt]]
name = "ThinkPad DDR5 SO-DIMM 64GB kits (2x32GB)"
parts = ["ddr5_sodimm_64_kit"]
target = 400.0

[[hunt]]
name = "ThinkPad DDR5 SO-DIMM 96GB kits (2x48GB)"
parts = ["ddr5_sodimm_96_kit"]
target = 600.0

# Optional standalone desktop memory notices. Compatibility is checked for the
# actual intended machine, independently of any RAM-completion/reuse plan.
# Existing limits retain their dated retail-quote basis in desktop-memory-market.toml.
[[hunt]]
name = "Desktop DDR5 UDIMM 96GB kits (2x48GB)"
parts = ["ddr5_udimm_96_kit"]
target = 1109.99

[[hunt]]
name = "Desktop DDR5 UDIMM 64GB sticks"
parts = ["ddr5_udimm_64"]
target = 937.49

# Display requirements and exact-model 25% discount limits are in
# monitor-watch.toml. Different models never share a market-value history.
[[hunt]]
name = "27-inch 4K gaming monitors with DisplayPort"
parts = ["monitor_4k_27_standard", "monitor_4k_27_oled"]
note = "27-inch class, 3840x2160, at least 144Hz at 4K; DisplayPort required. OLED optional."
