# 27-inch-class 4K gaming monitors. OLED is optional; DisplayPort is required.
# OLED panels sold as 27-inch may have a 26.5/26.7-inch viewable diagonal.
[requirements]
size_class_inches = 27
min_refresh_hz = 144
resolution = [3840, 2160]
displayport_required = true
condition = "new"

# Alert only at least 25% below the exact model's recorded retail quote.
# Benchmarks are dated selling prices, not MSRP or sold-price valuations.
# Missing benchmarks disable alerts for that model. Refresh quotes manually.
[pricing]
discount_percent = 25

[[watch]]
key = "monitor_4k_27_standard"
name = "27-inch 4K 144Hz+ DisplayPort monitors"

[[watch]]
key = "monitor_4k_27_oled"
name = "27-inch 4K 144Hz+ DisplayPort OLED monitors"

# Exact model specifications fill missing title fields; they never prove stock.
# Unknown models can be recognized from explicit specs; alerts need a benchmark.
