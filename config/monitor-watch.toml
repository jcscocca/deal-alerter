# 27-inch-class 4K gaming monitors. OLED is optional; DisplayPort is required.
# OLED panels sold as 27-inch may have a 26.5/26.7-inch viewable diagonal.
[requirements]
size_class_inches = 27
min_refresh_hz = 144
resolution = [3840, 2160]
displayport_required = true
condition = "new"

# Initial price limits, using the existing 25% discount preference. These are
# representative class benchmarks, NOT each monitor's value or sold-price data.
# Quotes read 2026-10-14; shipping/tax/checkout were not verified. Refresh these
# manually when the market changes. Never pool different models into history.
[pricing]
discount_percent = 25

[[watch]]
key = "monitor_4k_27_standard"
name = "27-inch 4K 144Hz+ DisplayPort monitors"
benchmark = 399.99
benchmark_model = "Alienware AW2725QF"
checked_on = "2026-10-14"
source = "https://www.dell.com/en-us/shop/monitors/apd/alienware-27-4k-dualresolution-gaming-monitor-aw2725qf/aw2725qf_monitor/-"

[[watch]]
key = "monitor_4k_27_oled"
name = "27-inch 4K 144Hz+ DisplayPort OLED monitors"
benchmark = 799.99
benchmark_model = "Alienware AW2725Q"
checked_on = "2026-10-14"
source = "https://www.dell.com/en-us/shop/monitors/apd/alienware-27-4k-qdoled-gaming-monitor-aw2725q/aw2725q_monitor/-"

# Exact model specifications fill missing title fields; they never prove stock.
# Unknown models can qualify when the title explicitly proves every requirement.
[[model]]
aliases = ["AW2725QF"]
panel = "IPS"
refresh_hz = 180
dual_mode = true
ports = "DP 1.4; 2x HDMI 2.1; USB hub / USB-C downstream"
source = "https://www.dell.com/en-us/shop/monitors/apd/alienware-27-4k-dualresolution-gaming-monitor-aw2725qf/aw2725qf_monitor/-"

