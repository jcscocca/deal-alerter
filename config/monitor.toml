# Fast local hardware monitor. Nothing starts until the Windows cutover is approved.
[monitor]
retailer_seconds = 120
feed_seconds = 300
discovery_seconds = 600
legacy_seconds = 900
heartbeat_seconds = 15
stale_seconds = 600
max_backoff_seconds = 3600
max_products_per_retailer = 48
workers = 6
# Keep the existing hardware email digest under the same local writer.
# The installed service reports missing SMTP credentials as degraded health.
digest_utc = "02:52"

[hp_browser]
# Experimental: interactive access works, fresh headless access is unverified.
# Install requirements-browser.txt and pass the documented unattended probe
# before opting in. The shipped/live configuration keeps the current transport.
enabled = false
channel = "msedge"

