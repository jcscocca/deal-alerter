# Parts and display monitor. Runtime activation follows the existing release procedure.
[monitor]
retailer_seconds = 120
feed_seconds = 300
discovery_seconds = 600
legacy_seconds = 900
heartbeat_seconds = 15
stale_seconds = 600
max_backoff_seconds = 3600
# Retained scheduler bounds; complete-PC product and discovery jobs are retired.
max_products_per_retailer = 64
workers = 6
# Keep the existing hardware email digest under the same local writer.
# The installed service reports missing SMTP credentials as degraded health.
digest_utc = "02:52"
